<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orient Gate Tours</title>
<style>
:root{color-scheme:light;--bg:#f6f5f2;--card:#fcfcfb;--bd:#e0dfd9;--tx:#0b0b0b;--tx2:#52514e;--ac:#2a78d6;--er:#e34948}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121211;--card:#1a1a19;--bd:#33332f;--tx:#fff;--tx2:#c3c2b7;--ac:#3987e5;--er:#e66767}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);
 font-family:"Segoe UI","Noto Sans Arabic",Arial,sans-serif;padding:16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:30px 26px;width:100%;max-width:360px;text-align:center}
h1{font-size:17px;margin:0 0 6px}
p{color:var(--tx2);font-size:13px;margin:0 0 20px}
input{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);
 color:var(--tx);font-size:15px;font-family:inherit;text-align:center;margin-bottom:11px}
input:focus{outline:2px solid var(--ac);outline-offset:1px}
button{width:100%;padding:11px;border:none;border-radius:9px;background:var(--ac);color:#fff;
 font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6;cursor:default}
.lg{margin:0 auto 18px;width:88px}
.lg img{width:88px;height:auto;display:block}
.lg .d{display:none}
@media (prefers-color-scheme:dark){.lg .l{display:none}.lg .d{display:block}}
.err{color:var(--er);font-size:13px;margin-top:11px;min-height:18px}
</style>
</head>

<script>
(function(){
  var D = JSON.parse(document.getElementById("payload").textContent);
  var f = document.getElementById("f"), p = document.getElementById("p"),
      b = document.getElementById("b"), e = document.getElementById("e");
  function b64(s){ var x = atob(s), a = new Uint8Array(x.length);
    for (var i=0;i<x.length;i++) a[i] = x.charCodeAt(i); return a; }
  f.addEventListener("submit", async function(ev){
    ev.preventDefault();
    if(!p.value) return;
    b.disabled = true; b.textContent = "بيفتح…"; e.textContent = "";
    try{
      var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(p.value),
        {name:"PBKDF2"}, false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        {name:"PBKDF2", salt:b64(D.salt), iterations:D.iter, hash:"SHA-256"},
        km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      var out = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.iv)}, key, b64(D.ct));
      var html = new TextDecoder().decode(out);
      document.open(); document.write(html); document.close();
    }catch(err){
      e.textContent = "الباسورد غلط";
      b.disabled = false; b.textContent = "فتح";
      p.value = ""; p.focus();
    }
  });
})();
</script>
